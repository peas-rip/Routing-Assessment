[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.testing"
# --ds beats the container's DJANGO_SETTINGS_MODULE env var, so pytest inside
# docker compose always uses the testing settings.
addopts = "-ra --ds=config.settings.testing"
pythonpath = ["."]
testpaths = ["apps", "common"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "common", "config"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "migrations"

[tool.coverage.run]
source = ["apps", "common"]
omit = ["*/migrations/*", "*/tests/*", "*/admin.py", "config/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
