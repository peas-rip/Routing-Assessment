services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: spotter
      POSTGRES_USER: spotter
      POSTGRES_PASSWORD: ${DB_PASSWORD:-spotter_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spotter -d spotter"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  django:
    build:
      context: ../backend
      args:
        # Testing deps bundled so `docker compose exec django pytest` works;
        # they are not used at runtime.
        REQUIREMENTS_FILE: testing.txt
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ../backend:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DATABASE_URL=postgres://spotter:${DB_PASSWORD:-spotter_dev_password}@postgres:5432/spotter
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - OPENROUTESERVICE_API_KEY=${OPENROUTESERVICE_API_KEY:-}
      - OSRM_BASE_URL=${OSRM_BASE_URL:-https://router.project-osrm.org}
      - NWS_BASE_URL=${NWS_BASE_URL:-https://api.weather.gov}
      - NWS_USER_AGENT=${NWS_USER_AGENT:-Routing-Assessment/1.0}

  celery:
    build:
      context: ../backend
      args:
        REQUIREMENTS_FILE: testing.txt
    command: celery -A config worker -l info
    volumes:
      - ../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DATABASE_URL=postgres://spotter:${DB_PASSWORD:-spotter_dev_password}@postgres:5432/spotter
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - OPENROUTESERVICE_API_KEY=${OPENROUTESERVICE_API_KEY:-}
      - OSRM_BASE_URL=${OSRM_BASE_URL:-https://router.project-osrm.org}
      - NWS_BASE_URL=${NWS_BASE_URL:-https://api.weather.gov}
      - NWS_USER_AGENT=${NWS_USER_AGENT:-Routing-Assessment/1.0}
      # django owns migrations; running them from both services races on
      # CREATE EXTENSION postgis and crashes one of them.
      - SKIP_MIGRATIONS=1

volumes:
  postgres_data:
  redis_data:
